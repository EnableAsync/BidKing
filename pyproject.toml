[project]
name = "bidking"
version = "0.1.0"
description = "竞拍之王估价辅助 GUI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.11.1",
    "rapidocr-onnxruntime>=1.4.4",
    "pywin32>=308 ; sys_platform == 'win32'",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
bidking-gui = "bidking.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bidking"]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]

[tool.hatch.build]
include = [
    "bidking/**/*.py",
    "bidking/data/*.json",
]
